version: '3.8'

services:
  engidone_auth-db:
    image: postgres:18
    container_name: engidoneauth-db
    environment:
      DB_NAME_FILE: ${DB_NAME_FILE}
      DB_USER_FILE: ${DB_USER_FILE}
      DB_PASSWORD_FILE: ${DB_PASSWORD_FILE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - engidone-auth_net 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/db_user) -d $(cat /run/secrets/db_name) || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s  

  engidoneauth:
    depends_on:
      engidone_auth-db:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile.development
    environment:
      DB_NAME_FILE: ${DB_NAME_FILE}
      DB_USER_FILE: ${DB_USER_FILE}
      DB_PASSWORD_FILE: ${DB_PASSWORD_FILE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
    ports:
      - "3001:3001"
    restart: unless-stopped
    networks:
      - engidone-auth_net
      - engidone

volumes:
  postgres_data:

networks:
  engidone-auth_net: # internal
    driver: bridge
  engidone: # external
    driver: bridge